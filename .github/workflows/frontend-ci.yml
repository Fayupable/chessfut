name: Frontend CI

on:
  pull_request:
    branches: [ "dev/**", main ]
    paths:
      - "chessfut-fe/**"
  push:
    branches: [ dev, main ]
    paths:
      - "chessfut-fe/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: chessfut-fe/package-lock.json

      - name: Install dependencies
        run: cd chessfut-fe && npm ci

      - name: Lint
        run: cd chessfut-fe && npm run lint

      - name: Type check
        run: cd chessfut-fe && npx tsc --noEmit

      - name: Test with coverage
        run: cd chessfut-fe && npm run test:coverage

      - name: Coverage check
        id: coverage
        run: |
          cd chessfut-fe
          COVERAGE=$(node -e "console.log(require('./coverage/coverage-summary.json').total.lines.pct)")
          echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"
          echo "Frontend Coverage: $COVERAGE%"

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = '${{ steps.coverage.outputs.coverage }}';
            const pct = parseFloat(coverage);
            const status = pct >= 50 ? 'PASS' : pct >= 20 ? 'WARN' : 'INFO';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '## Frontend Coverage Report',
                '',
                `Status: ${status}`,
                `Total Line Coverage: ${coverage}%`,
                '',
                '_Only pure logic functions are unit tested by design — components are verified manually via preview, not covered here._'
              ].join('\n')
            })

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: chessfut-fe/coverage/
          retention-days: 7

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: "https://placeholder.invalid"
        run: cd chessfut-fe && npm run build