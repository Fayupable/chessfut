name: Frontend CI

on:
  pull_request:
    branches: [ "dev/**", main ]
    paths:
      - "chessfut-fe/**"
  push:
    branches: [ dev, main ]
    paths:
      - "chessfut-fe/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: chessfut-fe/package-lock.json

      - name: Install dependencies
        run: cd chessfut-fe && npm ci

      - name: Lint
        run: cd chessfut-fe && npm run lint

      - name: Type check
        run: cd chessfut-fe && npx tsc --noEmit

      - name: Test
        run: cd chessfut-fe && npm run test

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: "https://placeholder.invalid"
        run: cd chessfut-fe && npm run build