name: Backend CI

on:
  pull_request:
    branches: [dev]
    paths:
      - "chessfut-be/**"
  push:
    branches: [dev]
    paths:
      - "chessfut-be/**"

defaults:
  run:
    working-directory: chessfut-be

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: chessfut-be/go.sum

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: chessfut-be
          args: --config=.golangci.yml

      - name: Test with coverage
        run: go test ./... -race -coverprofile=coverage.out

      - name: Enforce coverage threshold
        uses: vladopajic/go-test-coverage@v2
        with:
          config: chessfut-be/.testcoverage.yml
          profile: chessfut-be/coverage.out
          git-token: ${{ github.token }}
          git-summary: "true"