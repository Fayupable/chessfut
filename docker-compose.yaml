services:
  postgres:
    container_name: chessfut_postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chessfut-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  redis:
    container_name: chessfut_redis
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - chessfut-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 256M

  chessfut-backend:
    container_name: chessfut_backend
    build:
      context: ./chessfut-be
      dockerfile: Dockerfile
    environment:
      PORT: "8099"
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      ADMIN_API_KEY: "${ADMIN_API_KEY:?ADMIN_API_KEY is required}"
      CHESSCOM_USER_AGENT: "${CHESSCOM_USER_AGENT:-chessfut/1.0 (contact: your-email@example.com)}"
      CHESSCOM_BASE_URL: "${CHESSCOM_BASE_URL:-https://api.chess.com/pub}"
      VIRTUAL_HOST: "api.chessfut.com"
      VIRTUAL_PORT: "8099"
      LETSENCRYPT_HOST: "api.chessfut.com"
      LETSENCRYPT_EMAIL: "${LETSENCRYPT_EMAIL}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - chessfut-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 712M
        reservations:
          memory: 256M

  chessfut-frontend:
    container_name: chessfut_frontend
    build:
      context: ./chessfut-fe
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}"
    environment:
      VIRTUAL_HOST: "chessfut.com,www.chessfut.com"
      VIRTUAL_PORT: "3139"
      LETSENCRYPT_HOST: "chessfut.com,www.chessfut.com"
      LETSENCRYPT_EMAIL: "${LETSENCRYPT_EMAIL}"
    depends_on:
      - chessfut-backend
    networks:
      - chessfut-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

networks:
  chessfut-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data: